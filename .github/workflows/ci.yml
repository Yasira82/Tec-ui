name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'claude/**']

# One run per ref. Pushing again to a PR branch cancels the superseded run
# instead of racing it: the last commit is the only one anyone reads, and
# without this every intermediate push paid for a full pipeline — CI's five
# jobs, a CodeQL analysis, a Playwright install-build-and-run — that was
# obsolete before it finished.
#
# `main` is EXCLUDED from cancellation on purpose: a run there is the
# post-merge record (and the status a deploy gate reads). Cancelling those
# would trade money for the one signal worth keeping.
#
# This expression is copied verbatim from `tec-knowledge-base`
# knowledge-ci.yml — the fleet had TWO forms of this rule and the other one
# (tec-app, `cancel-in-progress: true`) cancels main runs as well. One rule,
# one spelling (P2).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}


jobs:
  ci:
    name: Type-check · Test · Build · Policy
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-ui-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-ui-

      - run: npm install

      - name: Type-check
        run: npm run typecheck

      - name: Tests + Coverage
        run: npm test

      - name: Build
        run: npm run build

      - name: Policy — no Pi SDK references
        run: |
          if grep -r "window\.Pi\|Pi\.init\|Pi\.createPayment" src/ --include="*.ts" --include="*.tsx" 2>/dev/null \
            | grep -v "__tests__" \
            | grep -v "^\s*//" \
            | grep -v "//.*Pi\."; then
            echo "FAIL: Pi SDK reference detected in package source"
            exit 1
          fi
          echo "clean — no Pi SDK references"

      - name: Policy — no CSS modules or Tailwind
        run: |
          if grep -r "\.module\.\|tailwind\|styled-components" src/ --include="*.ts" --include="*.tsx" 2>/dev/null | grep -v "__tests__"; then
            echo "FAIL: CSS framework detected in package source"
            exit 1
          fi
          echo "clean — inline styles only"

      - name: Policy — no hardcoded Railway URLs
        run: |
          if grep -r "railway\.app" src/ --include="*.ts" --include="*.tsx" 2>/dev/null | grep -v "__tests__" | grep -v "^\s*//"; then
            echo "FAIL: Hardcoded Railway URL detected in package source"
            exit 1
          fi
          echo "clean — no Railway URLs"
